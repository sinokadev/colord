<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colord</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            overflow-x: hidden;
            background-color: #111;
            font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
        }

        .color-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
            width: 100%;
        }

        .color-box {
            aspect-ratio: 1 / 1;
            width: 100%;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: default;
            will-change: transform;
            transition: transform 0.2s ease 0s, box-shadow 0.2s ease 0s;
        }

        /* 실제로 떠오른 상태일 때만 클릭 가능 커서로 변경 */
        .color-box.is-active {
            cursor: pointer;
        }

        .color-box:hover {
            transform: translate(var(--tx, 0px), var(--ty, 0px)) scale(1.5);
            box-shadow: 0 0 36px rgba(0, 0, 0, 0.55);
            transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1) 0.45s, box-shadow 0.32s ease 0.45s;
        }

        /* 네모 박스 정중앙 HEX 코드 */
        .color-code {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: -0.01em;
            pointer-events: none;
            user-select: none;
            opacity: 0;
            transition: opacity 0.12s ease 0s;
        }

        /* 네모 박스 아래쪽에 크게 뜨는 흰색 색 이름 */
        .color-name {
            position: absolute;
            top: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%);
            color: #FFFFFF;
            font-size: 12.5px;
            font-weight: 600;
            letter-spacing: -0.01em;
            white-space: nowrap;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.75);
            pointer-events: none;
            user-select: none;
            opacity: 0;
            transition: opacity 0.12s ease 0s;
        }

        .color-name:empty {
            display: none;
        }

        /* 왼쪽/오른쪽 끝 칸에서는 이름이 화면 밖으로 잘리지 않게 정렬 */
        .color-box[data-edge-x="left"] .color-name {
            left: 0;
            transform: none;
        }

        .color-box[data-edge-x="right"] .color-name {
            left: auto;
            right: 0;
            transform: none;
        }

        .color-box:hover .color-code,
        .color-box:hover .color-name {
            opacity: 1;
            transition: opacity 0.28s ease 0.45s;
        }

        .backdrop-overlay {
            position: fixed;
            inset: 0;
            z-index: 5;
            pointer-events: none;
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            opacity: 0;
            transition: opacity 0.32s ease;
        }

        .color-grid.has-active ~ .backdrop-overlay {
            opacity: 1;
        }

        /* 하단 크레딧 푸터 */
        .footer {
            position: relative;
            z-index: 1;
            padding: 28px 16px;
            text-align: center;
            font-size: 13px;
            font-weight: 400;
            letter-spacing: -0.01em;
            color: rgba(255, 255, 255, 0.42);
            user-select: none;
        }

        .footer strong {
            font-weight: 600;
            color: rgba(255, 255, 255, 0.65);
        }

        .footer a {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 600;
            text-decoration: none;
            padding-bottom: 2px;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .footer a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 85%;
            height: 1px;
            background: linear-gradient(90deg, #60a5fa, #c084fc, #f472b6);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .footer a:hover {
            color: #FFFFFF;
        }

        .footer a:hover::after {
            transform: scaleX(1);
        }
    </style>
</head>
<body>
    <color-grid class="color-grid" id="grid" data-colors="{{ colors | tojson | forceescape }}"></color-grid>
    <div class="backdrop-overlay"></div>

    <footer class="footer">
        using <strong>Colord</strong> by <a href="https://sinoka.dev/" target="_blank" rel="noopener noreferrer">SinokaDev🧊</a>
    </footer>

    <script type="module" src="/static/dist/colord.js"></script>
</body>
</html>
