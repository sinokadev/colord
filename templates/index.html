<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colord</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html *, html *::before, html *::after {
            border: none !important;
        }

        body {
            overflow-x: hidden;
            background-color: #111;
            font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
        }

        .color-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
            width: 100%;
        }

        .color-box {
            aspect-ratio: 1 / 1;
            width: 100%;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: default;
            will-change: transform;
            transition: transform 0.2s ease 0s, box-shadow 0.2s ease 0s;
        }

        /* 실제로 떠오른 상태일 때만 클릭 가능 커서로 변경 */
        .color-box.is-active {
            cursor: pointer;
            z-index: 10;
            transform: translate(var(--tx, 0px), var(--ty, 0px)) scale(1.5);
            box-shadow: 0 0 36px rgba(0, 0, 0, 0.55);
            transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.32s ease;
        }

        /* 네모 박스 정중앙 HEX 코드 */
        .color-code {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: -0.01em;
            pointer-events: none;
            user-select: none;
            opacity: 0;
            transition: opacity 0.12s ease 0s;
        }

        /* 네모 박스 아래쪽에 크게 뜨는 흰색 색 이름 */
        .color-name {
            position: absolute;
            top: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%);
            color: #FFFFFF;
            font-size: 12.5px;
            font-weight: 600;
            letter-spacing: -0.01em;
            white-space: nowrap;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.75);
            pointer-events: none;
            user-select: none;
            opacity: 0;
            transition: opacity 0.12s ease 0s;
        }

        .color-name:empty {
            display: none;
        }

        /* 왼쪽/오른쪽 끝 칸에서는 이름이 화면 밖으로 잘리지 않게 정렬 */
        .color-box[data-edge-x="left"] .color-name {
            left: 0;
            transform: none;
        }

        .color-box[data-edge-x="right"] .color-name {
            left: auto;
            right: 0;
            transform: none;
        }

        .color-box.is-active .color-code,
        .color-box.is-active .color-name {
            opacity: 1;
            transition: opacity 0.28s ease;
        }

        .backdrop-overlay {
            position: fixed;
            inset: 0;
            z-index: 5;
            pointer-events: none;
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            opacity: 0;
            transition: opacity 0.32s ease;
        }

        .color-grid.has-active ~ .backdrop-overlay {
            opacity: 1;
        }

        /* 하단 크레딧 푸터 */
        .footer {
            position: relative;
            z-index: 1;
            padding: 28px 16px;
            text-align: center;
            font-size: 13px;
            font-weight: 400;
            letter-spacing: -0.01em;
            color: rgba(255, 255, 255, 0.42);
            user-select: none;
        }

        .footer strong {
            font-weight: 600;
            color: rgba(255, 255, 255, 0.65);
        }

        .footer a {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 600;
            text-decoration: none;
            padding-bottom: 2px;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .footer a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 85%;
            height: 1px;
            background: linear-gradient(90deg, #60a5fa, #c084fc, #f472b6);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .footer a:hover {
            color: #FFFFFF;
        }

        .footer a:hover::after {
            transform: scaleX(1);
        }
    </style>
</head>
<body>
    <div class="color-grid" id="grid">
        {% for item in colors %}
        <div class="color-box"
             data-color="{{ item.color }}"
             data-name="{{ item.name or '' }}"
             style="background-color: {{ item.color }};">
            <span class="color-code">{{ item.color }}</span>
            <span class="color-name">{{ item.name or '' }}</span>
        </div>
        {% endfor %}
    </div>
    <div class="backdrop-overlay"></div>

    <footer class="footer">
        using <a href="https://github.com/sinokadev/colord" target="_blank" rel="noopener noreferrer"><strong>Colord</strong></a> by <a href="https://sinoka.dev/" target="_blank" rel="noopener noreferrer">SinokaDev🧊</a>
    </footer>

    <script>
        // ========================================================
        // [설정] 포커스/화면에서 벗어났을 때 흐려지는 효과(블러) 활성화 여부
        // false: 비활성화 (포커스/화면을 벗어나도 흐려지지 않음)
        // true: 활성화 (화면/포커스를 벗어나면 흐려짐)
        // ========================================================
        const BLUR_ON_UNFOCUS = false;

        // 정렬 버전 플래그
        // false: 직전 커밋의 정렬 방식 (기본값)
        // true: 현재 커밋의 정렬 방식
        const USE_CURRENT_SORT = false;

        // 고채도(비비드)와 저채도(파스텔/톤다운)를 나누는 기준점 (0 ~ 100)
        const SATURATION_SPLIT = 45;

        function parseHex(hex) {
            let clean = hex.replace('#', '');
            if (clean.length === 3) {
                clean = clean.split('').map(c => c + c).join('');
            }
            return {
                r: parseInt(clean.substring(0, 2), 16),
                g: parseInt(clean.substring(2, 4), 16),
                b: parseInt(clean.substring(4, 6), 16)
            };
        }

        function hexToHsl(hex) {
            const rgb = parseHex(hex);
            const r = rgb.r / 255;
            const g = rgb.g / 255;
            const b = rgb.b / 255;

            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h = 0, s = 0, l = (max + min) / 2;

            if (max !== min) {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
                else if (max === g) h = ((b - r) / d + 2) / 6;
                else h = ((r - g) / d + 4) / 6;
            }
            return { h: h * 360, s: s * 100, l: l * 100 };
        }

        function getContrastTextColor(hex) {
            const { r, g, b } = parseHex(hex);
            const yiq = (r * 299 + g * 587 + b * 114) / 1000;
            return yiq >= 128 ? '#111111' : '#FFFFFF';
        }

        // 0: 고채도 유채색 / 1: 저채도 유채색(파스텔·톤다운) / 2: 무채색
        function getColorTier(hsl) {
            if (hsl.s < 10 || hsl.l < 4 || hsl.l > 98) return 2;
            return hsl.s >= SATURATION_SPLIT ? 0 : 1;
        }

        const rawColors = Array.from(document.querySelectorAll('.color-box'))
            .map(el => ({
                hex: el.dataset.color,
                name: el.dataset.name || ''
            }));

        const sortedColors = USE_CURRENT_SORT
            ? rawColors
                .map(item => {
                    const hsl = hexToHsl(item.hex);
                    return { ...item, ...hsl, tier: getColorTier(hsl) };
                })
                .sort((a, b) => {
                    // 1. 큰 그룹 분리: 고채도 구역 -> 저채도 구역 -> 무채색 구역
                    if (a.tier !== b.tier) {
                        return a.tier - b.tier;
                    }

                    // 2. 무채색끼리는 밝은 순 (White -> Gray -> Black)
                    if (a.tier === 2) {
                        return b.l - a.l;
                    }

                    // 3. 각 유채색 구역 안에서는 색상(Hue) 순으로 무지개 배치
                    if (Math.abs(a.h - b.h) > 0.001) {
                        return a.h - b.h;
                    }
                    if (Math.abs(b.l - a.l) > 0.001) {
                        return b.l - a.l;
                    }
                    return b.s - a.s;
                })
            : rawColors
                .map(item => ({ ...item, ...hexToHsl(item.hex) }))
                .sort((a, b) => {
                    const aAchromatic = a.s < 10 || a.l < 4 || a.l > 98;
                    const bAchromatic = b.s < 10 || b.l < 4 || b.l > 98;

                    if (aAchromatic && !bAchromatic) return 1;
                    if (!aAchromatic && bAchromatic) return -1;
                    if (aAchromatic && bAchromatic) {
                        return b.l - a.l;
                    }

                    if (Math.abs(a.h - b.h) > 0.001) {
                        return a.h - b.h;
                    }
                    if (Math.abs(b.s - a.s) > 15) {
                        return b.s - a.s;
                    }
                    if (Math.abs(b.l - a.l) > 0.001) {
                        return b.l - a.l;
                    }
                    return b.s - a.s;
                });

        function renderColorGrid() {
            const grid = document.getElementById('grid');
            const boxes = Array.from(grid.children);
            const count = boxes.length;
            if (count === 0) return;

            const cols = getComputedStyle(grid).gridTemplateColumns.split(' ').length;

            // 열(Column)별로 그룹 분배 후, 각 열 내부는 위에서 아래로 어두워지도록(L 내림차순) 정렬
            let offset = 0;
            for (let c = 0; c < cols; c++) {
                const colCount = Math.floor(count / cols) + (c < (count % cols) ? 1 : 0);
                if (colCount === 0) continue;

                const colColors = sortedColors.slice(offset, offset + colCount);
                offset += colCount;

                if (USE_CURRENT_SORT) {
                    // 경계 열에서도 채도 그룹이 섞이지 않게 tier를 먼저 유지하고, 같은 그룹 안에서 명도 순 정렬
                    colColors.sort((a, b) => {
                        if (a.tier !== b.tier) return a.tier - b.tier;
                        if (Math.abs(b.l - a.l) > 1.5) return b.l - a.l;
                        if (Math.abs(b.s - a.s) > 5) return b.s - a.s;
                        return a.h - b.h;
                    });
                } else {
                    // 직전 커밋: 세로 방향에서는 명도 순을 유지
                    colColors.sort((a, b) => {
                        if (Math.abs(b.l - a.l) > 0.001) return b.l - a.l;
                        if (Math.abs(b.s - a.s) > 15) return b.s - a.s;
                        return a.h - b.h;
                    });
                }

                for (let r = 0; r < colCount; r++) {
                    const cellIdx = r * cols + c;
                    const { hex, name } = colColors[r];
                    const box = boxes[cellIdx];
                    const nameEl = box.querySelector('.color-name');
                    const codeEl = box.querySelector('.color-code');

                    box.dataset.color = hex;
                    box.dataset.name = name;
                    box.style.backgroundColor = hex;

                    if (nameEl) {
                        nameEl.textContent = name;
                    }
                    if (codeEl) {
                        codeEl.textContent = hex;
                        codeEl.style.color = getContrastTextColor(hex);
                    }
                }
            }
        }

        function updateEdgeTransform(box) {
            const rect = box.getBoundingClientRect();
            const gridRect = grid.getBoundingClientRect();
            const padX = rect.width * 0.3;
            const padY = rect.height * 0.3;
            const shift = 15;
            const hasName = Boolean(box.dataset.name);

            let originX = 'center';
            let tx = 0;
            if (rect.left < padX) {
                originX = 'left';
                tx = shift;
            } else if (window.innerWidth - rect.right < padX) {
                originX = 'right';
                tx = -shift;
            }

            let originY = 'center';
            let ty = 0;
            if (rect.top < padY) {
                originY = 'top';
                ty = shift;
            } else if (window.innerHeight - rect.bottom < padY || gridRect.bottom - rect.bottom < padY) {
                originY = 'bottom';
                ty = hasName ? -28 - shift : -shift;
            }

            box.dataset.edgeX = originX;
            box.style.transformOrigin = `${originX} ${originY}`;
            box.style.setProperty('--tx', `${tx}px`);
            box.style.setProperty('--ty', `${ty}px`);
        }

        async function copyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(text);
            } else {
                const tempInput = document.createElement('textarea');
                tempInput.value = text;
                tempInput.style.position = 'fixed';
                tempInput.style.opacity = '0';
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand('copy');
                document.body.removeChild(tempInput);
            }
        }

        let activeBox = null;
        let hoverTimer = null;
        let outsideTimer = null;
        const grid = document.getElementById('grid');

        function activateBox(box) {
            if (activeBox && activeBox !== box) {
                activeBox.classList.remove('is-active');
            }
            box.classList.add('is-active');
            activeBox = box;
            grid.classList.add('has-active');
        }

        grid.addEventListener('click', async (e) => {
            const box = e.target.closest('.color-box');
            // 완전히 올라온 상태(is-active)일 때만 복사 허용
            if (!box || !box.classList.contains('is-active')) return;

            const color = box.dataset.color;
            const label = box.querySelector('.color-code');

            await copyToClipboard(color);

            if (label) {
                clearTimeout(box.copyTimer);
                label.textContent = 'Copied!';
                box.copyTimer = setTimeout(() => {
                    label.textContent = color;
                }, 900);
            }
        });

        grid.addEventListener('mouseover', (e) => {
            const box = e.target.closest('.color-box');
            if (!box) return;

            clearTimeout(outsideTimer);

            if (activeBox !== box) {
                updateEdgeTransform(box);
            }

            clearTimeout(hoverTimer);
            hoverTimer = setTimeout(() => activateBox(box), 450);
        });

        grid.addEventListener('mouseout', (e) => {
            const box = e.target.closest('.color-box');
            if (!box || box.contains(e.relatedTarget)) return;

            clearTimeout(hoverTimer);
            box.classList.remove('is-active');
            if (activeBox === box) {
                activeBox = null;
            }
            grid.classList.remove('has-active');
        });

        function handleFocusLeave() {
            clearTimeout(hoverTimer);
            clearTimeout(outsideTimer);
            if (activeBox) {
                activeBox.classList.remove('is-active');
                activeBox = null;
            }
            grid.classList.remove('has-active');

            if (BLUR_ON_UNFOCUS) {
                outsideTimer = setTimeout(() => {
                    grid.classList.add('has-active');
                }, 1000);
            }
        }

        function handleFocusEnter() {
            clearTimeout(outsideTimer);
            grid.classList.remove('has-active');
        }

        document.documentElement.addEventListener('mouseleave', handleFocusLeave);
        document.documentElement.addEventListener('mouseenter', handleFocusEnter);
        window.addEventListener('blur', handleFocusLeave);
        window.addEventListener('focus', handleFocusEnter);

        renderColorGrid();
        window.addEventListener('resize', renderColorGrid);
    </script>
</body>
</html>
