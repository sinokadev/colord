<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Manager — Colord</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/monolith.min.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html *, html *::before, html *::after {
            border: none !important;
        }

        body {
            min-height: 100vh;
            background-color: #0d0d0d;
            color: #fff;
            font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
            display: flex;
            flex-direction: column;
        }

        .hidden {
            display: none !important;
        }

        /* Top Header Navigation */
        .top-navbar {
            background: #141414;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 0 24px;
        }

        .navbar-inner {
            max-width: 1560px;
            margin: 0 auto;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .brand-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-title {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 7px;
            border-radius: 6px;
            background: rgba(96, 165, 250, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(96, 165, 250, 0.3);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-link {
            font-size: 13.5px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            padding: 7px 12px;
            border-radius: 8px;
            transition: all 0.15s ease;
        }

        .nav-link:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.06);
        }

        /* Main Container */
        .main-container {
            flex: 1;
            max-width: 1560px;
            width: 100%;
            margin: 0 auto;
            padding: 28px 24px 60px;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        /* Stats & Action Banner */
        .stats-banner {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            background: #161616;
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 16px;
            padding: 18px 22px;
        }

        .stats-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 18px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13.5px;
            color: rgba(255, 255, 255, 0.65);
        }

        .stat-value {
            font-size: 17px;
            font-weight: 700;
            color: #fff;
        }

        .stat-badge-unnamed {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 2px 7px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .btn-add-primary {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 16px;
            border-radius: 10px;
            border: none;
            background: #fff;
            color: #111;
            font-family: inherit;
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-add-primary:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        /* Controls & Filter Bar */
        .controls-bar {
            background: #161616;
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
        }

        .controls-left {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 280px;
        }

        .search-wrapper {
            position: relative;
            min-width: 240px;
            flex: 1;
            max-width: 360px;
        }

        .search-input {
            width: 100%;
            height: 40px;
            background: #0f0f0f;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 0 14px;
            color: #fff;
            font-size: 13.5px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s ease;
        }

        .search-input:focus {
            border-color: #60a5fa;
        }

        .filter-chip {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            height: 40px;
            padding: 0 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #0f0f0f;
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            user-select: none;
            transition: all 0.15s ease;
        }

        .filter-chip:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.25);
            background: #191919;
        }

        .filter-chip.active {
            background: rgba(96, 165, 250, 0.15);
            color: #93c5fd;
            border-color: rgba(96, 165, 250, 0.4);
            font-weight: 600;
        }

        .filter-chip .chip-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: background 0.15s ease;
        }

        .filter-chip.active .chip-dot {
            background: #60a5fa;
            box-shadow: 0 0 6px rgba(96, 165, 250, 0.7);
        }

        /* Similar color picker in controls */
        .similar-picker-wrap {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 40px;
            padding: 0 10px 0 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #0f0f0f;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
        }

        .similar-color-preview {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
        }

        .similar-hex-input {
            width: 76px;
            height: 28px;
            background: #181818;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 6px;
            color: #fff;
            font-size: 12px;
            font-family: inherit;
            padding: 0 6px;
            text-align: center;
            outline: none;
            text-transform: uppercase;
        }

        .similar-hex-input:focus {
            border-color: #60a5fa;
        }

        .controls-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .select-sort {
            height: 40px;
            background: #0f0f0f;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: rgba(255, 255, 255, 0.85);
            font-size: 13px;
            font-family: inherit;
            padding: 0 12px;
            outline: none;
            cursor: pointer;
        }

        .select-sort:focus {
            border-color: #60a5fa;
        }

        .view-toggle-group {
            display: flex;
            background: #0f0f0f;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 3px;
        }

        .view-btn {
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.5);
            padding: 6px 10px;
            border-radius: 7px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }

        .view-btn:hover {
            color: #fff;
        }

        .view-btn.active {
            background: #222;
            color: #fff;
        }

        /* Color Cards Grid Layout (Wide, Full-Screen) */
        .color-grid-view {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }

        .color-card {
            background: #161616;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .color-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .card-swatch {
            width: 100%;
            height: 90px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
        }

        .swatch-code {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.01em;
            opacity: 0.95;
            transition: transform 0.15s ease;
        }

        .card-swatch:hover .swatch-code {
            transform: scale(1.08);
        }

        .card-body {
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            justify-content: space-between;
        }

        .card-name-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 24px;
        }

        .card-name-text {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .card-name-empty {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.35);
            font-style: italic;
            cursor: pointer;
            transition: color 0.15s ease;
        }

        .card-name-empty:hover {
            color: #60a5fa;
            text-decoration: underline;
        }

        .card-meta-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 12px;
            color: rgba(255, 255, 255, 0.45);
        }

        .card-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-action-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.7);
            padding: 5px 9px;
            font-size: 12px;
            font-family: inherit;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.15s ease;
        }

        .card-action-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.12);
        }

        .card-action-btn.del-btn:hover {
            color: #f87171;
            background: rgba(248, 113, 113, 0.15);
            border-color: rgba(248, 113, 113, 0.3);
        }

        /* Color Table View (Dense, Wide) */
        .color-table-wrapper {
            background: #161616;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            overflow: hidden;
        }

        table.color-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13.5px;
            text-align: left;
        }

        table.color-table th {
            background: #111;
            padding: 12px 18px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        table.color-table td {
            padding: 12px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            vertical-align: middle;
        }

        table.color-table tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .table-swatch {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            flex-shrink: 0;
            cursor: pointer;
        }

        /* Empty state */
        .empty-state {
            padding: 64px 24px;
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
        }

        /* Modals */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-dialog {
            background: #181818;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            width: 100%;
            max-width: 440px;
            padding: 24px;
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.7);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
        }

        .modal-close-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
            line-height: 1;
        }

        .modal-close-btn:hover {
            color: #fff;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin-bottom: 16px;
        }

        .form-field label {
            font-size: 12.5px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.65);
        }

        .form-input {
            width: 100%;
            height: 42px;
            padding: 0 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            background: #111;
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        .form-input:focus {
            border-color: #60a5fa;
        }

        .modal-preview-box {
            width: 100%;
            height: 64px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 18px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .btn-modal-primary {
            flex: 1;
            height: 44px;
            border-radius: 10px;
            border: none;
            background: #fff;
            color: #111;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-modal-secondary {
            flex: 1;
            height: 44px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: #242424;
            color: #fff;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        /* Toast notification */
        .toast-msg {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #1f1f1f;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 12px 18px;
            font-size: 13.5px;
            color: #fff;
            box-shadow: 0 10px 24px rgba(0,0,0,0.5);
            z-index: 300;
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.2s ease;
            pointer-events: none;
        }

        .toast-msg.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Inline edit input */
        .inline-edit-input {
            background: #111;
            border: 1px solid #60a5fa;
            border-radius: 6px;
            color: #fff;
            font-family: inherit;
            font-size: 13px;
            padding: 4px 8px;
            outline: none;
            width: 100%;
        }
    </style>
</head>
<body>
    <!-- Top Navigation -->
    <header class="top-navbar">
        <div class="navbar-inner">
            <div class="brand-area">
                <span class="brand-title">
                    Colord Manager
                </span>
            </div>
            <nav class="nav-links">
                <a href="/" class="nav-link">← Main Grid</a>
                <a href="/register" class="nav-link">Color Registration</a>
            </nav>
        </div>
    </header>

    <main class="main-container">
        <!-- Stats & Add Banner -->
        <section class="stats-banner">
            <div class="stats-group">
                <div class="stat-item">
                    <span>Total colors:</span>
                    <span class="stat-value" id="statTotalCount">0</span>
                </div>
                <div class="stat-item">
                    <span>Named colors:</span>
                    <span class="stat-value" id="statNamedCount">0</span>
                </div>
                <div class="stat-item">
                    <span>Unnamed colors:</span>
                    <span class="stat-value stat-badge-unnamed" id="statUnnamedCount">0</span>
                </div>
            </div>
            <button type="button" class="btn-add-primary" id="openAddModalBtn">
                <span>+ Add Color</span>
            </button>
        </section>

        <!-- Controls Toolbar -->
        <section class="controls-bar">
            <div class="controls-left">
                <!-- Search input -->
                <div class="search-wrapper">
                    <input type="text" class="search-input" id="manageSearchInput" placeholder="Search color code or name..." />
                </div>

                <!-- Toggle: Unnamed colors only -->
                <button type="button" class="filter-chip" id="toggleUnnamedBtn">
                    <span class="chip-dot"></span>
                    <span>Unnamed only</span>
                </button>

                <!-- Toggle: Similar color filter -->
                <div class="similar-picker-wrap">
                    <button type="button" class="filter-chip" id="toggleSimilarBtn" style="border:none; background:transparent; padding:0; height:auto;">
                        <span class="chip-dot"></span>
                        <span>Similar to:</span>
                    </button>
                    <input type="text" class="similar-hex-input" id="similarHexInput" value="#FF0000" maxlength="7" />
                    <div class="similar-color-preview" id="similarColorPreview" style="background-color: #FF0000;" title="Click to change the reference color"></div>
                </div>
            </div>

            <div class="controls-right">
                <!-- Sort options -->
                <select class="select-sort" id="sortSelect">
                    <option value="hue">Sort: Hue (Red → Orange → Green → Blue → Pink)</option>
                    <option value="lightness-desc">Sort: Lightest first</option>
                    <option value="lightness-asc">Sort: Darkest first</option>
                    <option value="name">Sort: Name (A–Z)</option>
                    <option value="recent">Sort: Recently added</option>
                </select>

                <!-- View switcher -->
                <div class="view-toggle-group">
                    <button type="button" class="view-btn active" id="viewGridBtn" title="Grid view">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                    </button>
                    <button type="button" class="view-btn" id="viewTableBtn" title="Table view">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </div>
        </section>

        <!-- Container for Grid View or Table View -->
        <section id="contentContainer">
            <div class="color-grid-view" id="colorGridView"></div>
            <div class="color-table-wrapper hidden" id="colorTableView">
                <table class="color-table">
                    <thead>
                        <tr>
                            <th style="width: 54px;">Color</th>
                            <th style="width: 140px;">HEX Code</th>
                            <th>Color Name</th>
                            <th style="width: 120px;">HSL</th>
                            <th style="width: 150px; text-align: right;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="colorTableBody"></tbody>
                </table>
            </div>
            <div class="empty-state hidden" id="emptyState">
                No matching colors found.
            </div>
        </section>
    </main>

    <!-- Modal: Password Auth -->
    <div class="modal-backdrop hidden" id="authModal">
        <div class="modal-dialog">
            <div class="modal-header">
                <h2 class="modal-title">Admin Authentication</h2>
            </div>
            <form id="authModalForm">
                <div class="form-field">
                    <label for="adminPwInput">Enter the admin password</label>
                    <input type="password" class="form-input" id="adminPwInput" placeholder="Password" required autofocus />
                </div>
                <div style="min-height: 20px; font-size: 13px; color: #f87171; margin-bottom: 14px;" id="authModalError"></div>
                <button type="submit" class="btn-modal-primary">Log In</button>
            </form>
        </div>
    </div>

    <!-- Modal: Add or Edit Color -->
    <div class="modal-backdrop hidden" id="colorModal">
        <div class="modal-dialog">
            <div class="modal-header">
                <h2 class="modal-title" id="colorModalTitle">Add Color</h2>
                <button type="button" class="modal-close-btn" id="closeColorModalBtn">✕</button>
            </div>
            <form id="colorModalForm">
                <div class="modal-preview-box" id="modalPreviewBox" style="background-color: #FF0000; color: #fff;">
                    #FF0000
                </div>

                <div class="form-field">
                    <label for="modalHexInput">HEX Color Code</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" class="form-input" id="modalHexInput" value="#FF0000" maxlength="7" placeholder="#RRGGBB" required />
                    </div>
                </div>

                <div class="form-field">
                    <label for="modalNameInput">Color Name (Optional)</label>
                    <input type="text" class="form-input" id="modalNameInput" placeholder="e.g. Deep Crimson" maxlength="40" />
                </div>

                <div style="min-height: 20px; font-size: 13px; color: #f87171; margin-bottom: 14px;" id="colorModalError"></div>

                <div class="modal-actions">
                    <button type="submit" class="btn-modal-primary" id="modalSubmitBtn">Save</button>
                    <button type="button" class="btn-modal-secondary" id="modalCancelBtn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast message -->
    <div class="toast-msg" id="toastMsg">Copied!</div>

    <script>
        let adminPassword = sessionStorage.getItem('colord_admin_pw') || '';
        let colors = {{ colors | tojson }};
        let activeView = 'grid'; // 'grid' | 'table'

        let filterUnnamed = false;
        let filterSimilar = false;
        let similarBaseHex = '#FF0000';
        let currentSort = 'hue';

        let editingTargetColor = null; // null for add, or '#HEX' for update

        // Elements
        const statTotalCount = document.getElementById('statTotalCount');
        const statNamedCount = document.getElementById('statNamedCount');
        const statUnnamedCount = document.getElementById('statUnnamedCount');

        const manageSearchInput = document.getElementById('manageSearchInput');
        const toggleUnnamedBtn = document.getElementById('toggleUnnamedBtn');
        const toggleSimilarBtn = document.getElementById('toggleSimilarBtn');
        const similarHexInput = document.getElementById('similarHexInput');
        const similarColorPreview = document.getElementById('similarColorPreview');
        const sortSelect = document.getElementById('sortSelect');

        const viewGridBtn = document.getElementById('viewGridBtn');
        const viewTableBtn = document.getElementById('viewTableBtn');
        const colorGridView = document.getElementById('colorGridView');
        const colorTableView = document.getElementById('colorTableView');
        const colorTableBody = document.getElementById('colorTableBody');
        const emptyState = document.getElementById('emptyState');

        const openAddModalBtn = document.getElementById('openAddModalBtn');
        const authModal = document.getElementById('authModal');
        const authModalForm = document.getElementById('authModalForm');
        const adminPwInput = document.getElementById('adminPwInput');
        const authModalError = document.getElementById('authModalError');

        const colorModal = document.getElementById('colorModal');
        const colorModalTitle = document.getElementById('colorModalTitle');
        const closeColorModalBtn = document.getElementById('closeColorModalBtn');
        const colorModalForm = document.getElementById('colorModalForm');
        const modalHexInput = document.getElementById('modalHexInput');
        const modalNameInput = document.getElementById('modalNameInput');
        const modalPreviewBox = document.getElementById('modalPreviewBox');
        const modalSubmitBtn = document.getElementById('modalSubmitBtn');
        const modalCancelBtn = document.getElementById('modalCancelBtn');
        const colorModalError = document.getElementById('colorModalError');
        const toastMsg = document.getElementById('toastMsg');

        // Color Math Utilities
        function parseHex(hex) {
            let clean = (hex || '').replace('#', '').trim();
            if (clean.length === 3) {
                clean = clean.split('').map(c => c + c).join('');
            }
            if (clean.length !== 6) return null;
            return {
                r: parseInt(clean.substring(0, 2), 16),
                g: parseInt(clean.substring(2, 4), 16),
                b: parseInt(clean.substring(4, 6), 16)
            };
        }

        function hexToHsl(hex) {
            const rgb = parseHex(hex);
            if (!rgb) return { h: 0, s: 0, l: 0 };
            const r = rgb.r / 255;
            const g = rgb.g / 255;
            const b = rgb.b / 255;

            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h = 0, s = 0, l = (max + min) / 2;

            if (max !== min) {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
                else if (max === g) h = ((b - r) / d + 2) / 6;
                else h = ((r - g) / d + 4) / 6;
            }
            return { h: h * 360, s: s * 100, l: l * 100 };
        }

        function colorDistance(hex1, hex2) {
            const c1 = parseHex(hex1);
            const c2 = parseHex(hex2);
            if (!c1 || !c2) return Infinity;
            const rmean = (c1.r + c2.r) / 2;
            const dr = c1.r - c2.r;
            const dg = c1.g - c2.g;
            const db = c1.b - c2.b;
            return Math.sqrt(
                (2 + rmean / 256) * dr * dr +
                4 * dg * dg +
                (2 + (255 - rmean) / 256) * db * db
            );
        }

        function getContrastTextColor(hex) {
            const rgb = parseHex(hex);
            if (!rgb) return '#FFFFFF';
            const yiq = (rgb.r * 299 + rgb.g * 587 + rgb.b * 114) / 1000;
            return yiq >= 128 ? '#111111' : '#FFFFFF';
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function showToast(message) {
            toastMsg.textContent = message;
            toastMsg.classList.add('show');
            setTimeout(() => toastMsg.classList.remove('show'), 1600);
        }

        async function copyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(text);
            } else {
                const input = document.createElement('textarea');
                input.value = text;
                input.style.position = 'fixed';
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
            }
            showToast(`${text} copied!`);
        }

        // Authentication & Check
        async function checkOrPromptAuth() {
            if (adminPassword) {
                try {
                    const res = await fetch('/auth', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password: adminPassword })
                    });
                    if (res.ok) return true;
                } catch (e) {}
            }
            authModal.classList.remove('hidden');
            adminPwInput.value = '';
            authModalError.textContent = '';
            adminPwInput.focus();
            return false;
        }

        authModalForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const pw = adminPwInput.value.trim();
            try {
                const res = await fetch('/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pw })
                });
                if (res.ok) {
                    adminPassword = pw;
                    sessionStorage.setItem('colord_admin_pw', pw);
                    authModal.classList.add('hidden');
                } else {
                    authModalError.textContent = res.status === 401 ? 'Incorrect password.' : 'Server configuration error.';
                }
            } catch (err) {
                authModalError.textContent = 'Unable to connect to the server.';
            }
        });

        // Filter & Sort Logic
        function getFilteredAndSortedColors() {
            const query = manageSearchInput.value.trim().toLowerCase();
            const SIMILAR_THRESHOLD = 135;

            let list = colors.map(item => ({
                ...item,
                ...hexToHsl(item.color)
            }));

            // 1. Unnamed colors only
            if (filterUnnamed) {
                list = list.filter(item => !item.name || !item.name.trim());
            }

            // 2. Similar colors only
            if (filterSimilar && parseHex(similarBaseHex)) {
                list = list
                    .map(item => ({
                        ...item,
                        dist: colorDistance(similarBaseHex, item.color)
                    }))
                    .filter(item => item.dist <= SIMILAR_THRESHOLD)
                    .sort((a, b) => a.dist - b.dist);
            }

            // 3. Search filter
            if (query) {
                list = list.filter(item => {
                    const matchHex = item.color.toLowerCase().includes(query);
                    const matchName = (item.name || '').toLowerCase().includes(query);
                    return matchHex || matchName;
                });
            }

            // 4. Apply the selected sort unless similar-color filtering is active.
            if (!filterSimilar) {
                if (currentSort === 'hue') {
                    list.sort((a, b) => {
                        const aAchromatic = a.s < 10 || a.l < 4 || a.l > 98;
                        const bAchromatic = b.s < 10 || b.l < 4 || b.l > 98;
                        if (aAchromatic && !bAchromatic) return 1;
                        if (!aAchromatic && bAchromatic) return -1;
                        if (aAchromatic && bAchromatic) return b.l - a.l;
                        if (Math.abs(a.h - b.h) > 0.001) return a.h - b.h;
                        if (Math.abs(b.s - a.s) > 15) return b.s - a.s;
                        return b.l - a.l;
                    });
                } else if (currentSort === 'lightness-desc') {
                    list.sort((a, b) => b.l - a.l);
                } else if (currentSort === 'lightness-asc') {
                    list.sort((a, b) => a.l - b.l);
                } else if (currentSort === 'name') {
                    list.sort((a, b) => (a.name || 'zzz').localeCompare(b.name || 'zzz'));
                } else if (currentSort === 'recent') {
                    list.reverse();
                }
            }

            return list;
        }

        // Render UI
        function renderManager() {
            // Update stats
            const total = colors.length;
            const named = colors.filter(c => c.name && c.name.trim()).length;
            const unnamed = total - named;

            statTotalCount.textContent = total;
            statNamedCount.textContent = named;
            statUnnamedCount.textContent = unnamed;

            const list = getFilteredAndSortedColors();

            if (list.length === 0) {
                emptyState.classList.remove('hidden');
                colorGridView.classList.add('hidden');
                colorTableView.classList.add('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            if (activeView === 'grid') {
                colorGridView.classList.remove('hidden');
                colorTableView.classList.add('hidden');
                renderGridView(list);
            } else {
                colorGridView.classList.add('hidden');
                colorTableView.classList.remove('hidden');
                renderTableView(list);
            }
        }

        function renderGridView(list) {
            colorGridView.innerHTML = list.map(item => {
                const textColor = getContrastTextColor(item.color);
                return `
                <div class="color-card" data-color="${item.color}" data-name="${escapeHtml(item.name || '')}">
                    <div class="card-swatch" style="background-color: ${item.color};" onclick="copyToClipboard('${item.color}')" title="Click to copy">
                        <span class="swatch-code" style="color: ${textColor};">${item.color}</span>
                    </div>
                    <div class="card-body">
                        <div class="card-name-row">
                            ${item.name
                                ? `<span class="card-name-text" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</span>`
                                : `<span class="card-name-empty quick-name-btn" title="Click to name this color">+ Unnamed</span>`
                            }
                        </div>
                        <div class="card-meta-row">
                            <span>H:${Math.round(item.h)}° L:${Math.round(item.l)}%</span>
                            <div class="card-actions">
                                <button type="button" class="card-action-btn edit-btn" title="Edit color and name">Edit</button>
                                <button type="button" class="card-action-btn del-btn" title="Delete">Delete</button>
                            </div>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        function renderTableView(list) {
            colorTableBody.innerHTML = list.map(item => `
                <tr data-color="${item.color}" data-name="${escapeHtml(item.name || '')}">
                    <td>
                        <div class="table-swatch" style="background-color: ${item.color};" onclick="copyToClipboard('${item.color}')" title="Click to copy"></div>
                    </td>
                    <td>
                        <strong style="cursor: pointer;" onclick="copyToClipboard('${item.color}')">${item.color}</strong>
                    </td>
                    <td>
                        ${item.name
                            ? `<span>${escapeHtml(item.name)}</span>`
                            : `<span class="card-name-empty quick-name-btn">+ Unnamed (click to enter a name)</span>`
                        }
                    </td>
                    <td style="color: rgba(255,255,255,0.45); font-size: 12.5px;">
                        H:${Math.round(item.h)}° S:${Math.round(item.s)}% L:${Math.round(item.l)}%
                    </td>
                    <td style="text-align: right;">
                        <div style="display: inline-flex; gap: 6px;">
                            <button type="button" class="card-action-btn edit-btn">Edit</button>
                            <button type="button" class="card-action-btn del-btn">Delete</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // View Toggle
        viewGridBtn.addEventListener('click', () => {
            activeView = 'grid';
            viewGridBtn.classList.add('active');
            viewTableBtn.classList.remove('active');
            renderManager();
        });

        viewTableBtn.addEventListener('click', () => {
            activeView = 'table';
            viewTableBtn.classList.add('active');
            viewGridBtn.classList.remove('active');
            renderManager();
        });

        // Filter Event Listeners
        toggleUnnamedBtn.addEventListener('click', () => {
            filterUnnamed = !filterUnnamed;
            toggleUnnamedBtn.classList.toggle('active', filterUnnamed);
            renderManager();
        });

        toggleSimilarBtn.addEventListener('click', () => {
            filterSimilar = !filterSimilar;
            toggleSimilarBtn.classList.toggle('active', filterSimilar);
            renderManager();
        });

        similarHexInput.addEventListener('input', () => {
            let val = similarHexInput.value.trim().toUpperCase();
            if (val && !val.startsWith('#')) val = '#' + val;
            similarHexInput.value = val;
            if (/^#([0-9A-F]{6}|[0-9A-F]{3})$/.test(val)) {
                similarBaseHex = val;
                similarColorPreview.style.backgroundColor = val;
                if (filterSimilar) renderManager();
            }
        });

        sortSelect.addEventListener('change', () => {
            currentSort = sortSelect.value;
            renderManager();
        });

        manageSearchInput.addEventListener('input', renderManager);

        // Quick In-place Name Edit
        document.getElementById('contentContainer').addEventListener('click', async (e) => {
            const quickBtn = e.target.closest('.quick-name-btn');
            if (quickBtn) {
                const parentRow = quickBtn.closest('[data-color]');
                if (!parentRow) return;
                const targetColor = parentRow.dataset.color;

                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'inline-edit-input';
                input.placeholder = 'Enter a new name, then press Enter';
                quickBtn.replaceWith(input);
                input.focus();

                const saveInline = async () => {
                    const newName = input.value.trim();
                    if (!await checkOrPromptAuth()) return;
                    try {
                        const res = await fetch(`/colors/${encodeURIComponent(targetColor)}`, {
                            method: 'PUT',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-Admin-Password': adminPassword
                            },
                            body: JSON.stringify({ name: newName || "" })
                        });
                        const data = await res.json();
                        if (res.ok) {
                            colors = data.colors;
                            showToast('Name updated!');
                            renderManager();
                        } else {
                            alert(data.detail || 'Unable to update the color.');
                            renderManager();
                        }
                    } catch (err) {
                        alert('Unable to connect to the server.');
                        renderManager();
                    }
                };

                input.addEventListener('keydown', (ev) => {
                    if (ev.key === 'Enter') saveInline();
                    if (ev.key === 'Escape') renderManager();
                });
                input.addEventListener('blur', saveInline);
                return;
            }

            // Edit button click
            const editBtn = e.target.closest('.edit-btn');
            if (editBtn) {
                const parentRow = editBtn.closest('[data-color]');
                if (!parentRow) return;
                const targetColor = parentRow.dataset.color;
                const targetName = parentRow.dataset.name;
                openEditModal(targetColor, targetName);
                return;
            }

            // Delete button click
            const delBtn = e.target.closest('.del-btn');
            if (delBtn) {
                const parentRow = delBtn.closest('[data-color]');
                if (!parentRow) return;
                const targetColor = parentRow.dataset.color;

                if (!confirm(`Are you sure you want to delete ${targetColor}?`)) return;
                if (!await checkOrPromptAuth()) return;

                try {
                    const res = await fetch(`/colors/${encodeURIComponent(targetColor)}`, {
                        method: 'DELETE',
                        headers: { 'X-Admin-Password': adminPassword }
                    });
                    const data = await res.json();
                    if (res.ok) {
                        colors = data.colors;
                        showToast(`${targetColor} deleted.`);
                        renderManager();
                    } else {
                        alert(data.detail || 'Unable to delete the color.');
                    }
                } catch (err) {
                    alert('A server communication error occurred.');
                }
            }
        });

        // Add / Edit Modal Logic
        function updateModalPreview() {
            let val = modalHexInput.value.trim().toUpperCase();
            if (!val.startsWith('#')) val = '#' + val;
            if (/^#([0-9A-F]{6}|[0-9A-F]{3})$/.test(val)) {
                modalPreviewBox.style.backgroundColor = val;
                modalPreviewBox.style.color = getContrastTextColor(val);
                modalPreviewBox.textContent = val;
            }
        }

        modalHexInput.addEventListener('input', updateModalPreview);

        function openAddModal() {
            editingTargetColor = null;
            colorModalTitle.textContent = 'Add Color';
            modalHexInput.value = '#FF0000';
            modalNameInput.value = '';
            colorModalError.textContent = '';
            modalSubmitBtn.textContent = 'Add';
            updateModalPreview();
            colorModal.classList.remove('hidden');
            modalHexInput.focus();
        }

        function openEditModal(color, name) {
            editingTargetColor = color;
            colorModalTitle.textContent = 'Edit Color';
            modalHexInput.value = color;
            modalNameInput.value = name || '';
            colorModalError.textContent = '';
            modalSubmitBtn.textContent = 'Save Changes';
            updateModalPreview();
            colorModal.classList.remove('hidden');
            modalNameInput.focus();
        }

        openAddModalBtn.addEventListener('click', async () => {
            if (await checkOrPromptAuth()) {
                openAddModal();
            }
        });

        closeColorModalBtn.addEventListener('click', () => colorModal.classList.add('hidden'));
        modalCancelBtn.addEventListener('click', () => colorModal.classList.add('hidden'));

        colorModalForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            colorModalError.textContent = '';

            let color = modalHexInput.value.trim().toUpperCase();
            if (!color.startsWith('#')) color = '#' + color;
            const name = modalNameInput.value.trim();

            if (!/^#([0-9A-F]{6}|[0-9A-F]{3})$/.test(color)) {
                colorModalError.textContent = 'Enter a valid HEX code (#RGB or #RRGGBB).';
                return;
            }

            if (!await checkOrPromptAuth()) return;

            try {
                if (editingTargetColor) {
                    // Update
                    const res = await fetch(`/colors/${encodeURIComponent(editingTargetColor)}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Admin-Password': adminPassword
                        },
                        body: JSON.stringify({ color, name: name ? name : "" })
                    });
                    const data = await res.json();
                    if (!res.ok) {
                        colorModalError.textContent = data.detail || 'Unable to update the color.';
                        return;
                    }
                    colors = data.colors;
                    colorModal.classList.add('hidden');
                    showToast(`${color} updated!`);
                    renderManager();
                } else {
                    // Add
                    const res = await fetch('/colors', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Admin-Password': adminPassword
                        },
                        body: JSON.stringify({ color, name: name || null })
                    });
                    const data = await res.json();
                    if (!res.ok) {
                        colorModalError.textContent = data.detail || 'This color already exists or an error occurred.';
                        return;
                    }
                    colors = data.colors;
                    colorModal.classList.add('hidden');
                    showToast(`${color} added!`);
                    renderManager();
                }
            } catch (err) {
                colorModalError.textContent = 'A server communication error occurred.';
            }
        });

        // Initialize
        renderManager();
    </script>
</body>
</html>
